name: Mobile hero readability fix

on:
  push:
    paths:
      - '.github/workflows/mobile-hero-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve mobile hero readability
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''    .hero-content{padding-top:140px;padding-bottom:200px;}\n    .hero-caption{left:var(--edge);right:var(--edge);max-width:none;bottom:28px;}\n'''
          new = '''    .hero-media img{\n      object-position:56% center;\n      transform:scale(1.02);\n    }\n    .hero-media::after{\n      background:\n        linear-gradient(180deg,\n          rgba(20,22,12,0.24) 0%,\n          rgba(20,22,12,0.30) 20%,\n          rgba(30,33,18,0.62) 42%,\n          rgba(20,22,12,0.84) 72%,\n          rgba(15,16,9,0.96) 100%\n        );\n    }\n    .hero-content{padding-top:140px;padding-bottom:200px;}\n    .hero-content h1{\n      font-size:clamp(2.45rem,10vw,3.15rem);\n      line-height:1.04;\n      text-shadow:0 2px 14px rgba(0,0,0,0.28);\n    }\n    .hero-content p{\n      color:#F4F2EC;\n      font-size:1rem;\n      line-height:1.55;\n      text-shadow:0 1px 10px rgba(0,0,0,0.32);\n    }\n    .hero-caption{left:var(--edge);right:var(--edge);max-width:none;bottom:28px;}\n'''
          if old not in s:
              raise SystemExit('Expected mobile hero block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve mobile hero readability"
          git push
