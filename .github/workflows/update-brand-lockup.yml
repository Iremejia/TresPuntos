name: Update Tres Puntos brand lockup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-brand-lockup.yml'

permissions:
  contents: write

jobs:
  update-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update header and footer brand lockup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = ".brand{display:flex;align-items:center;gap:12px;}\n  .brand img{height:34px;width:auto;transition:filter .35s ease;}"
          new_css = ".brand{display:flex;align-items:center;}\n  .brand img{height:34px;width:auto;transition:filter .35s ease;}\n  .brand-name{font-family:'IBM Plex Sans',sans-serif;font-size:0.88rem;font-weight:400;letter-spacing:0.22em;white-space:nowrap;margin-left:32px;color:var(--offwhite);opacity:.96;transition:color .35s ease;}\n  header.scrolled .brand-name{color:var(--ink);}"
          if old_css in s:
              s = s.replace(old_css, new_css, 1)

          old_header = '''  <a href="#" class="brand" aria-label="Tres Puntos, inicio">\n    <img src="images/logo-black.png" alt="Tres Puntos" class="logo-dark">\n    <img src="images/logo-white.png" alt="Tres Puntos" class="logo-light">\n  </a>'''
          new_header = '''  <a href="#" class="brand" aria-label="Tres Puntos, inicio">\n    <img src="images/logo-black.png" alt="Tres Puntos" class="logo-dark">\n    <img src="images/logo-white.png" alt="Tres Puntos" class="logo-light">\n    <span class="brand-name">Tres Puntos</span>\n  </a>'''
          if old_header in s:
              s = s.replace(old_header, new_header, 1)

          old_footer_css = "  .footer-inner img{height:30px;width:auto;}"
          new_footer_css = "  .footer-brand{display:flex;align-items:center;}\n  .footer-brand img{height:30px;width:auto;}\n  .footer-brand-name{font-family:'IBM Plex Sans',sans-serif;font-size:0.86rem;font-weight:400;letter-spacing:0.22em;margin-left:32px;color:var(--offwhite);opacity:.94;white-space:nowrap;}"
          if old_footer_css in s:
              s = s.replace(old_footer_css, new_footer_css, 1)

          old_footer = '''  <div class="footer-inner">\n    <img src="images/logo-white.png" alt="Tres Puntos C.A.">\n    <span class="footer-tagline">Energía · Industria · Infraestructura</span>'''
          new_footer = '''  <div class="footer-inner">\n    <div class="footer-brand">\n      <img src="images/logo-white.png" alt="Tres Puntos C.A.">\n      <span class="footer-brand-name">Tres Puntos</span>\n    </div>\n    <span class="footer-tagline">Energía · Industria · Infraestructura</span>'''
          if old_footer in s:
              s = s.replace(old_footer, new_footer, 1)

          mobile_anchor = "  @media (max-width: 420px){\n    .hero-content h1{max-width:none;}\n  }"
          mobile_new = "  @media (max-width: 560px){\n    .brand-name{font-size:.74rem;letter-spacing:.16em;margin-left:18px;}\n    .footer-brand-name{font-size:.74rem;letter-spacing:.16em;margin-left:18px;}\n  }\n\n" + mobile_anchor
          if mobile_anchor in s and "@media (max-width: 560px)" not in s:
              s = s.replace(mobile_anchor, mobile_new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Update horizontal Tres Puntos logo lockup"
            git push
          fi
