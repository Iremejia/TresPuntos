name: Enlarge Tres Puntos header brand

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-brand-lockup.yml'

permissions:
  contents: write

jobs:
  update-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enlarge header logo and brand name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(".brand img{height:34px;width:auto;transition:filter .35s ease;}", ".brand img{height:40px;width:auto;transition:filter .35s ease;}")
          s = s.replace("font-size:0.88rem;font-weight:400;letter-spacing:0.22em;white-space:nowrap;margin-left:32px", "font-size:0.98rem;font-weight:400;letter-spacing:0.20em;white-space:nowrap;margin-left:34px")
          s = s.replace(".brand-name{font-size:.74rem;letter-spacing:.16em;margin-left:18px;}", ".brand img{height:34px;}\n    .brand-name{font-size:.80rem;letter-spacing:.15em;margin-left:20px;}")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Enlarge Tres Puntos header brand"
            git push
          fi
