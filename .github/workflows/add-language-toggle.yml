name: Add bilingual language toggle

on:
  push:
    paths:
      - '.github/workflows/add-language-toggle.yml'
      - '.github/scripts/add_language_toggle.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch site
        run: python .github/scripts/add_language_toggle.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add English language toggle"
          git push
